<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>今日計畫</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  color-scheme: light;
  --bg: #f0ebe3;
  --surface: #faf7f2;
  --surface2: #ede8e0;
  --border: rgba(180,140,100,0.2);
  --text: #3a2e24;
  --text-muted: rgba(100,75,50,0.5);
  --accent: #c4693a;
  --accent-dim: rgba(196,105,58,0.12);
  --hour-height: 60px;
  --slot-height: 30px;
}

html, body { color-scheme: light; background-color: #f0ebe3; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100vh;
}

/* Header */
.header {
  padding: 14px 16px 10px;
  padding-top: max(4px, calc(env(safe-area-inset-top) - 10px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 0.5px solid rgba(180,140,100,0.2);
  flex-shrink: 0;
}
.header-nav { display: flex; align-items: center; gap: 12px; }
.nav-btn {
  background: none;
  border: 0.5px solid rgba(180,140,100,0.3);
  color: rgba(100,75,50,0.5) !important;
  -webkit-text-fill-color: rgba(100,75,50,0.5);
  width: 32px; height: 32px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  -webkit-appearance: none;
  appearance: none;
}
.nav-btn:active { background: var(--surface2); }
.header-date { text-align: center; }
.header-date .day-name { font-size: 11px; color: rgba(100,75,50,0.55); letter-spacing: 0.08em; text-transform: uppercase; }
.header-date .date-num { font-size: 22px; font-weight: 300; color: #3a2e24; line-height: 1.2; }
.today-btn {
  background: none;
  border: 0.5px solid rgba(180,140,100,0.3);
  color: rgba(100,75,50,0.6) !important;
  -webkit-text-fill-color: rgba(100,75,50,0.6);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  -webkit-appearance: none;
  appearance: none;
}
.today-btn:active { background: var(--surface2); }

/* Main layout */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* Timeline */
.timeline-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  -webkit-overflow-scrolling: touch;
}
.timeline-wrap::-webkit-scrollbar { display: none; }

.timeline {
  position: relative;
  margin-left: 44px;
  margin-right: 8px;
  padding-bottom: 20px;
}

.hour-row {
  position: relative;
  height: var(--hour-height);
  border-top: 0.5px solid rgba(180,140,100,0.2);
}
.hour-label {
  position: absolute;
  left: -40px;
  top: -9px;
  font-size: 11px;
  color: rgba(100,75,50,0.45);
  width: 36px;
  text-align: right;
}
.half-line {
  position: absolute;
  top: 50%;
  left: 0; right: 0;
  border-top: 0.5px dashed rgba(180,140,100,0.12);
}

/* Blocks on timeline */
.placed-block {
  position: absolute;
  left: 2px;
  right: 2px;
  background: #faf7f2;
  border: 1px solid rgba(196,105,58,0.3);
  border-left: 3px solid #c4693a;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: grab;
  user-select: none;
  touch-action: none;
  z-index: 5;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(180,120,60,0.1);
}
.placed-block:active { cursor: grabbing; }
.placed-block .block-title { font-size: 13px; color: #c4693a; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.placed-block .block-time { font-size: 11px; color: rgba(100,75,50,0.5); margin-top: 2px; }
.placed-block .resize-handle {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 12px;
  cursor: ns-resize;
  display: flex; align-items: center; justify-content: center;
}
.placed-block .resize-handle::after {
  content: '';
  width: 24px; height: 2px;
  background: rgba(196,105,58,0.3);
  border-radius: 2px;
}
.placed-block .delete-btn {
  position: absolute;
  top: 4px; right: 4px;
  width: 18px; height: 18px;
  background: rgba(196,105,58,0.1);
  border: none;
  border-radius: 4px;
  color: rgba(100,75,50,0.5);
  font-size: 11px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
}
.placed-block:hover .delete-btn { opacity: 1; }

/* Free time indicators */
.free-indicator {
  position: absolute;
  left: 2px; right: 2px;
  background: rgba(196,105,58,0.04);
  border: 0.5px dashed rgba(196,105,58,0.2);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 2;
}
.free-indicator span {
  font-size: 10px;
  color: rgba(196,105,58,0.55);
  letter-spacing: 0.05em;
}

/* Sidebar - block library */
.sidebar {
  width: 72px;
  flex-shrink: 0;
  border-left: 0.5px solid rgba(180,140,100,0.2);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 4px;
  gap: 6px;
  -webkit-overflow-scrolling: touch;
}
.sidebar::-webkit-scrollbar { display: none; }

.lib-block {
  background: #faf7f2;
  border: 1px solid rgba(196,105,58,0.25);
  border-radius: 8px;
  padding: 8px 4px;
  text-align: center;
  cursor: grab;
  user-select: none;
  touch-action: none;
  flex-shrink: 0;
  box-shadow: 0 1px 3px rgba(180,120,60,0.08);
}
.lib-block:active { cursor: grabbing; opacity: 0.7; }
.lib-block .lib-icon { font-size: 18px; }
.lib-block .lib-name { font-size: 9px; color: rgba(100,75,50,0.6); margin-top: 3px; line-height: 1.2; }

.add-block-btn {
  background: none;
  border: 1px dashed rgba(196,105,58,0.35);
  border-radius: 8px;
  padding: 8px 4px;
  color: rgba(196,105,58,0.7) !important;
  -webkit-text-fill-color: rgba(196,105,58,0.7);
  cursor: pointer;
  font-size: 18px;
  flex-shrink: 0;
  -webkit-appearance: none;
  appearance: none;
}
.add-block-btn:active { background: var(--surface2); }

/* Add block modal */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: #faf7f2;
  border: 0.5px solid rgba(180,140,100,0.2);
  border-radius: 16px 16px 0 0;
  padding: 20px 16px 32px;
  width: 100%;
  max-width: 480px;
}
.modal h3 { font-size: 15px; font-weight: 500; margin-bottom: 14px; color: #3a2e24; }
.modal input[type="text"] {
  width: 100%;
  background: #ede8e0;
  border: 0.5px solid rgba(180,140,100,0.25);
  color: #3a2e24;
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  margin-bottom: 8px;
  outline: none;
  font-family: inherit;
}
.modal input::placeholder { color: rgba(100,75,50,0.4); }
.emoji-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.emoji-opt {
  width: 36px; height: 36px;
  border-radius: 8px;
  border: 0.5px solid var(--border);
  background: var(--surface2);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.emoji-opt.selected { border-color: var(--accent); background: var(--accent-dim); }
.modal-actions { display: flex; gap: 8px; }
.modal-btn {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 0.5px solid rgba(180,140,100,0.3);
  background: none;
  color: #3a2e24 !important;
  -webkit-text-fill-color: #3a2e24;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
}
.modal-btn.primary { background: #c4693a !important; border-color: #c4693a !important; color: #fff !important; -webkit-text-fill-color: #fff; }

/* Drag ghost */
.drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  background: #faf7f2;
  border: 1px solid #c4693a;
  border-radius: 8px;
  padding: 6px 8px;
  opacity: 0.9;
  display: none;
  min-width: 60px;
  box-shadow: 0 4px 12px rgba(180,120,60,0.2);
}
.drag-ghost .ghost-title { font-size: 13px; color: #c4693a; }
</style>
</head>
<body>

<div class="header">
  <div class="header-nav">
    <button class="nav-btn" id="prev-btn">‹</button>
  </div>
  <div class="header-date">
    <div class="day-name" id="day-name"></div>
    <div class="date-num" id="date-num"></div>
  </div>
  <div class="header-nav" style="justify-content:flex-end;">
    <button class="today-btn" id="today-btn">今天</button>
    <button class="nav-btn" id="next-btn">›</button>
  </div>
</div>

<div class="main">
  <div class="timeline-wrap" id="timeline-wrap">
    <div class="timeline" id="timeline"></div>
  </div>
  <div class="sidebar" id="sidebar"></div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3>新增積木</h3>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input type="text" id="emoji-input" placeholder="emoji" maxlength="4" style="width:64px;text-align:center;font-size:20px;flex-shrink:0;" />
      <input type="text" id="block-name-input" placeholder="積木名稱..." maxlength="10" style="flex:1;" />
    </div>
    <div class="modal-actions">
      <button class="modal-btn" id="modal-cancel">取消</button>
      <button class="modal-btn primary" id="modal-confirm">新增</button>
    </div>
  </div>
</div>

<!-- Edit block modal -->
<div class="modal-bg" id="edit-modal-bg">
  <div class="modal">
    <h3 id="edit-modal-title">編輯積木</h3>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input type="text" id="edit-emoji-input" placeholder="emoji" maxlength="4" style="width:64px;text-align:center;font-size:20px;flex-shrink:0;" />
      <input type="text" id="edit-name-input" placeholder="積木名稱..." maxlength="10" style="flex:1;" />
    </div>
    <div class="modal-actions">
      <button class="modal-btn danger" id="edit-delete-btn" style="border-color:rgba(255,100,100,0.4);color:rgba(255,120,120,0.9);">刪除</button>
      <button class="modal-btn" id="edit-cancel-btn">取消</button>
      <button class="modal-btn primary" id="edit-save-btn">儲存</button>
    </div>
  </div>
</div>

<!-- Rename placed block modal -->
<div class="modal-bg" id="rename-modal-bg">
  <div class="modal">
    <h3>自訂行程名稱</h3>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input type="text" id="rename-emoji-input" placeholder="emoji" maxlength="4" style="width:64px;text-align:center;font-size:20px;flex-shrink:0;" />
      <input type="text" id="rename-name-input" placeholder="行程名稱..." maxlength="15" style="flex:1;" />
    </div>
    <div class="modal-actions">
      <button class="modal-btn" id="rename-cancel-btn">取消</button>
      <button class="modal-btn primary" id="rename-save-btn">確認</button>
    </div>
  </div>
</div>

<div class="drag-ghost" id="drag-ghost">
  <div class="ghost-title" id="ghost-title"></div>
</div>

<script>
const STORAGE_KEY = 'pipi_planner_v1';
const START_HOUR = 7;
const END_HOUR = 22;
const TOTAL_SLOTS = (END_HOUR - START_HOUR) * 2;
const SLOT_H = 30;

const EMOJIS = ['🍳','🍜','🛁','🗑️','🏃','💊','📖','🎮','🛍️','🧹','☕','🌙','💼','🎨','🎵','🐱'];

const DEFAULT_BLOCKS = [
  { id: 'b1', name: '早餐', icon: '🍳', duration: 1 },
  { id: 'b2', name: '晚餐', icon: '🍜', duration: 2 },
  { id: 'b3', name: '洗澡', icon: '🛁', duration: 1 },
  { id: 'b4', name: '倒垃圾', icon: '🗑️', duration: 1 },
  { id: 'b5', name: '運動', icon: '🏃', duration: 2 },
];

function loadData() {
  try {
    const d = localStorage.getItem(STORAGE_KEY);
    if (d) return JSON.parse(d);
  } catch(e) {}
  return { blocks: DEFAULT_BLOCKS.map(b=>({...b})), days: {} };
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch(e) {}
}

let appData = loadData();
if (!appData.blocks) appData.blocks = DEFAULT_BLOCKS.map(b=>({...b}));
if (!appData.days) appData.days = {};

let currentDate = new Date();
currentDate.setHours(0,0,0,0);

function dateKey(d) {
  return d.toISOString().split('T')[0];
}

function getDayBlocks() {
  const key = dateKey(currentDate);
  if (!appData.days[key]) appData.days[key] = [];
  return appData.days[key];
}

const DAY_NAMES = ['日','一','二','三','四','五','六'];

function updateHeader() {
  const today = new Date(); today.setHours(0,0,0,0);
  const isToday = currentDate.getTime() === today.getTime();
  document.getElementById('day-name').textContent = (isToday ? '今天 · ' : '') + '週' + DAY_NAMES[currentDate.getDay()];
  document.getElementById('date-num').textContent = (currentDate.getMonth()+1) + '/' + currentDate.getDate();
}

// Build timeline
function buildTimeline() {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  tl.style.height = (TOTAL_SLOTS * SLOT_H) + 'px';
  tl.style.position = 'relative';

  for (let h = START_HOUR; h < END_HOUR; h++) {
    const row = document.createElement('div');
    row.className = 'hour-row';
    row.style.top = ((h - START_HOUR) * 2 * SLOT_H) + 'px';
    row.style.position = 'absolute';
    row.style.left = '0'; row.style.right = '0';
    row.style.height = SLOT_H * 2 + 'px';
    const label = document.createElement('div');
    label.className = 'hour-label';
    label.textContent = h + ':00';
    const half = document.createElement('div');
    half.className = 'half-line';
    row.appendChild(label);
    row.appendChild(half);
    tl.appendChild(row);
  }

  renderPlacedBlocks();
}

function slotToY(slot) { return slot * SLOT_H; }
function yToSlot(y) { return Math.round(y / SLOT_H); }
function slotToTime(slot) {
  const totalMin = slot * 30 + START_HOUR * 60;
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return h + ':' + (m === 0 ? '00' : '30');
}

function renderPlacedBlocks() {
  const tl = document.getElementById('timeline');
  document.querySelectorAll('.placed-block, .free-indicator').forEach(el => el.remove());

  const dayBlocks = getDayBlocks();
  dayBlocks.sort((a,b) => a.slot - b.slot);

  dayBlocks.forEach((pb, idx) => {
    const el = document.createElement('div');
    el.className = 'placed-block';
    el.style.top = slotToY(pb.slot) + 'px';
    el.style.height = (pb.duration * SLOT_H) + 'px';
    el.dataset.idx = idx;

    const title = document.createElement('div');
    title.className = 'block-title';
    title.textContent = pb.icon + ' ' + pb.name;

    const timeEl = document.createElement('div');
    timeEl.className = 'block-time';
    timeEl.textContent = slotToTime(pb.slot) + ' – ' + slotToTime(pb.slot + pb.duration);

    const resizeHandle = document.createElement('div');
    resizeHandle.className = 'resize-handle';

    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = '×';
    delBtn.onclick = (e) => {
      e.stopPropagation();
      dayBlocks.splice(idx, 1);
      saveData();
      renderPlacedBlocks();
    };

    el.appendChild(title);
    if (pb.duration >= 2) el.appendChild(timeEl);
    el.appendChild(resizeHandle);
    el.appendChild(delBtn);
    tl.appendChild(el);

    setupBlockDrag(el, pb, idx);
    setupResizeDrag(resizeHandle, pb);
  });

  renderFreeTime();
}

function renderFreeTime() {
  const tl = document.getElementById('timeline');
  document.querySelectorAll('.free-indicator').forEach(el => el.remove());

  const dayBlocks = getDayBlocks();
  const occupied = new Array(TOTAL_SLOTS).fill(false);
  dayBlocks.forEach(pb => {
    for (let i = pb.slot; i < pb.slot + pb.duration && i < TOTAL_SLOTS; i++) {
      occupied[i] = true;
    }
  });

  let freeStart = -1;
  for (let i = 0; i <= TOTAL_SLOTS; i++) {
    if (i < TOTAL_SLOTS && !occupied[i]) {
      if (freeStart === -1) freeStart = i;
    } else {
      if (freeStart !== -1) {
        const len = i - freeStart;
        if (len >= 2) {
          const indicator = document.createElement('div');
          indicator.className = 'free-indicator';
          indicator.style.top = (slotToY(freeStart) + 2) + 'px';
          indicator.style.height = (len * SLOT_H - 4) + 'px';
          const hours = len / 2;
          indicator.innerHTML = `<span>${hours % 1 === 0 ? hours : hours.toFixed(1)} 小時空檔</span>`;
          tl.appendChild(indicator);
        }
        freeStart = -1;
      }
    }
  }
}

// Drag placed block
function setupBlockDrag(el, pb, idx) {
  const tlWrap = document.getElementById('timeline-wrap');
  let startY, startSlot, dragging = false;

  const onMove = (clientY) => {
    if (!dragging) return;
    const tlRect = document.getElementById('timeline').getBoundingClientRect();
    const relY = clientY - tlRect.top;
    let newSlot = yToSlot(relY - (pb.duration * SLOT_H / 2));
    newSlot = Math.max(0, Math.min(TOTAL_SLOTS - pb.duration, newSlot));
    pb.slot = newSlot;
    el.style.top = slotToY(newSlot) + 'px';
    el.querySelector('.block-time') && (el.querySelector('.block-time').textContent = slotToTime(newSlot) + ' – ' + slotToTime(newSlot + pb.duration));
  };

  el.addEventListener('touchstart', e => {
    if (e.target.classList.contains('resize-handle') || e.target.classList.contains('delete-btn')) return;
    e.stopPropagation();
    dragging = true;
    startY = e.touches[0].clientY;
    el.style.zIndex = 50;
    el.style.opacity = '0.85';
    const move = ev => { onMove(ev.touches[0].clientY); };
    const end = () => {
      dragging = false;
      el.style.zIndex = 5;
      el.style.opacity = '1';
      saveData();
      renderPlacedBlocks();
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', end);
    };
    document.addEventListener('touchmove', move, { passive: true });
    document.addEventListener('touchend', end);
  }, { passive: true });

  el.addEventListener('mousedown', e => {
    if (e.target.classList.contains('resize-handle') || e.target.classList.contains('delete-btn')) return;
    e.preventDefault();
    dragging = true;
    el.style.zIndex = 50;
    el.style.opacity = '0.85';
    const move = ev => { onMove(ev.clientY); };
    const end = () => {
      dragging = false;
      el.style.zIndex = 5;
      el.style.opacity = '1';
      saveData();
      renderPlacedBlocks();
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', end);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', end);
  });
}

// Resize handle
function setupResizeDrag(handle, pb) {
  const onMove = (clientY) => {
    const tlRect = document.getElementById('timeline').getBoundingClientRect();
    const relY = clientY - tlRect.top;
    const endSlot = yToSlot(relY);
    const newDur = Math.max(1, Math.min(TOTAL_SLOTS - pb.slot, endSlot - pb.slot));
    pb.duration = newDur;
    const el = handle.parentElement;
    el.style.height = (newDur * SLOT_H) + 'px';
    el.querySelector('.block-time') && (el.querySelector('.block-time').textContent = slotToTime(pb.slot) + ' – ' + slotToTime(pb.slot + newDur));
  };

  handle.addEventListener('touchstart', e => {
    e.stopPropagation();
    const move = ev => { onMove(ev.touches[0].clientY); };
    const end = () => {
      saveData();
      renderPlacedBlocks();
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', end);
    };
    document.addEventListener('touchmove', move, { passive: true });
    document.addEventListener('touchend', end);
  }, { passive: true });

  handle.addEventListener('mousedown', e => {
    e.stopPropagation(); e.preventDefault();
    const move = ev => { onMove(ev.clientY); };
    const end = () => {
      saveData();
      renderPlacedBlocks();
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', end);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', end);
  });
}

// Sidebar library
let editingBlockId = null;

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';

  // Custom one-time block (always first)
  const customEl = document.createElement('div');
  customEl.className = 'lib-block';
  customEl.innerHTML = `<div class="lib-icon">✏️</div><div class="lib-name">自訂</div>`;
  customEl.title = '拖入後可改名稱';
  setupLibDrag(customEl, { id: 'custom_once', name: '自訂行程', icon: '✏️', duration: 1, isCustomOnce: true });
  sb.appendChild(customEl);

  appData.blocks.forEach(b => {
    const el = document.createElement('div');
    el.className = 'lib-block';
    el.innerHTML = `<div class="lib-icon">${b.icon}</div><div class="lib-name">${b.name}</div>`;
    setupLibDrag(el, b);
    setupLibLongPress(el, b);
    sb.appendChild(el);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'add-block-btn';
  addBtn.textContent = '+';
  addBtn.onclick = openAddModal;
  sb.appendChild(addBtn);
}

function setupLibLongPress(el, b) {
  let timer = null;
  const trigger = () => {
    editingBlockId = b.id;
    document.getElementById('edit-emoji-input').value = b.icon;
    document.getElementById('edit-name-input').value = b.name;
    document.getElementById('edit-modal-bg').classList.add('open');
  };
  el.addEventListener('touchstart', () => { timer = setTimeout(trigger, 600); }, { passive: true });
  el.addEventListener('touchend', () => clearTimeout(timer), { passive: true });
  el.addEventListener('touchmove', () => clearTimeout(timer), { passive: true });
  el.addEventListener('mousedown', () => { timer = setTimeout(trigger, 600); });
  el.addEventListener('mouseup', () => clearTimeout(timer));
}

document.getElementById('edit-cancel-btn').onclick = () => document.getElementById('edit-modal-bg').classList.remove('open');
document.getElementById('edit-save-btn').onclick = () => {
  const b = appData.blocks.find(b => b.id === editingBlockId);
  if (!b) return;
  const name = document.getElementById('edit-name-input').value.trim();
  const icon = document.getElementById('edit-emoji-input').value.trim() || b.icon;
  if (!name) return;
  b.name = name; b.icon = icon;
  saveData();
  buildSidebar();
  renderPlacedBlocks();
  document.getElementById('edit-modal-bg').classList.remove('open');
};
document.getElementById('edit-delete-btn').onclick = () => {
  appData.blocks = appData.blocks.filter(b => b.id !== editingBlockId);
  saveData();
  buildSidebar();
  document.getElementById('edit-modal-bg').classList.remove('open');
};

// Drag from library to timeline
function setupLibDrag(el, blockDef) {
  const ghost = document.getElementById('drag-ghost');
  const ghostTitle = document.getElementById('ghost-title');

  const startDrag = (clientX, clientY) => {
    ghost.style.display = 'block';
    ghostTitle.textContent = blockDef.icon + ' ' + blockDef.name;
    ghost.style.left = (clientX - 30) + 'px';
    ghost.style.top = (clientY - 20) + 'px';
  };

  const moveDrag = (clientX, clientY) => {
    ghost.style.left = (clientX - 30) + 'px';
    ghost.style.top = (clientY - 20) + 'px';
  };

  const endDrag = (clientX, clientY) => {
    ghost.style.display = 'none';
    const tlWrap = document.getElementById('timeline-wrap');
    const tlRect = document.getElementById('timeline').getBoundingClientRect();
    if (clientX < tlRect.left || clientX > tlRect.right) return;
    const relY = clientY - tlRect.top + tlWrap.scrollTop;
    let slot = yToSlot(relY);
    slot = Math.max(0, Math.min(TOTAL_SLOTS - blockDef.duration, slot));
    const dayBlocks = getDayBlocks();
    const newBlock = { ...blockDef, slot, id: undefined };
    dayBlocks.push(newBlock);
    saveData();
    renderPlacedBlocks();
    if (blockDef.isCustomOnce) {
      const idx = dayBlocks.length - 1;
      openRenameModal(dayBlocks, idx);
    }
  };

  el.addEventListener('touchstart', e => {
    e.preventDefault();
    startDrag(e.touches[0].clientX, e.touches[0].clientY);
    const move = ev => moveDrag(ev.touches[0].clientX, ev.touches[0].clientY);
    const end = ev => {
      endDrag(ev.changedTouches[0].clientX, ev.changedTouches[0].clientY);
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', end);
    };
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('touchend', end);
  }, { passive: false });

  el.addEventListener('mousedown', e => {
    e.preventDefault();
    startDrag(e.clientX, e.clientY);
    const move = ev => moveDrag(ev.clientX, ev.clientY);
    const end = ev => {
      endDrag(ev.clientX, ev.clientY);
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', end);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', end);
  });
}

// Add block modal
function openAddModal() {
  document.getElementById('block-name-input').value = '';
  document.getElementById('emoji-input').value = '';
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(() => document.getElementById('block-name-input').focus(), 100);
}

document.getElementById('modal-cancel').onclick = () => document.getElementById('modal-bg').classList.remove('open');
document.getElementById('modal-confirm').onclick = () => {
  const name = document.getElementById('block-name-input').value.trim();
  const icon = document.getElementById('emoji-input').value.trim() || '⭐';
  if (!name) return;
  appData.blocks.push({ id: 'custom_' + Date.now(), name, icon, duration: 1 });
  saveData();
  buildSidebar();
  document.getElementById('modal-bg').classList.remove('open');
};

// Rename modal for custom once blocks
let renameDayBlocks = null;
let renameIdx = -1;
function openRenameModal(dayBlocks, idx) {
  renameDayBlocks = dayBlocks;
  renameIdx = idx;
  document.getElementById('rename-emoji-input').value = '';
  document.getElementById('rename-name-input').value = '';
  document.getElementById('rename-modal-bg').classList.add('open');
  setTimeout(() => document.getElementById('rename-name-input').focus(), 100);
}
document.getElementById('rename-cancel-btn').onclick = () => document.getElementById('rename-modal-bg').classList.remove('open');
document.getElementById('rename-save-btn').onclick = () => {
  const name = document.getElementById('rename-name-input').value.trim();
  const icon = document.getElementById('rename-emoji-input').value.trim() || '✏️';
  if (name && renameDayBlocks && renameIdx >= 0) {
    renameDayBlocks[renameIdx].name = name;
    renameDayBlocks[renameIdx].icon = icon;
    saveData();
    renderPlacedBlocks();
  }
  document.getElementById('rename-modal-bg').classList.remove('open');
};

// 7-day range: today to today+6
const today0 = new Date(); today0.setHours(0,0,0,0);
const lastDay = new Date(today0); lastDay.setDate(today0.getDate() + 6);

function clampDate() {
  if (currentDate < today0) currentDate = new Date(today0);
  if (currentDate > lastDay) currentDate = new Date(lastDay);
}

function updateNavBtns() {
  document.getElementById('prev-btn').disabled = currentDate.getTime() <= today0.getTime();
  document.getElementById('prev-btn').style.opacity = currentDate.getTime() <= today0.getTime() ? '0.3' : '1';
  document.getElementById('next-btn').disabled = currentDate.getTime() >= lastDay.getTime();
  document.getElementById('next-btn').style.opacity = currentDate.getTime() >= lastDay.getTime() ? '0.3' : '1';
}

// Navigation
document.getElementById('prev-btn').onclick = () => {
  currentDate.setDate(currentDate.getDate() - 1);
  clampDate();
  updateHeader();
  updateNavBtns();
  renderPlacedBlocks();
};
document.getElementById('next-btn').onclick = () => {
  currentDate.setDate(currentDate.getDate() + 1);
  clampDate();
  updateHeader();
  updateNavBtns();
  renderPlacedBlocks();
};
document.getElementById('today-btn').onclick = () => {
  currentDate = new Date(); currentDate.setHours(0,0,0,0);
  updateHeader();
  updateNavBtns();
  renderPlacedBlocks();
};

// Swipe navigation - only trigger if not dragging a block
let touchStartX = 0;
let touchStartY = 0;
let swipeLocked = false;
const wrap = document.getElementById('timeline-wrap');
wrap.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  swipeLocked = false;
}, { passive: true });
wrap.addEventListener('touchmove', e => {
  const dy = Math.abs(e.touches[0].clientY - touchStartY);
  const dx = Math.abs(e.touches[0].clientX - touchStartX);
  if (dy > dx) swipeLocked = true;
}, { passive: true });
wrap.addEventListener('touchend', e => {
  if (swipeLocked) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
  if (Math.abs(dx) > 80 && dy < 40) {
    if (dx < 0) document.getElementById('next-btn').click();
    else document.getElementById('prev-btn').click();
  }
}, { passive: true });

// Init
updateHeader();
updateNavBtns();
buildTimeline();
buildSidebar();

// Scroll to 8am
setTimeout(() => {
  document.getElementById('timeline-wrap').scrollTop = (8 - START_HOUR) * 2 * SLOT_H;
}, 100);
</script>
